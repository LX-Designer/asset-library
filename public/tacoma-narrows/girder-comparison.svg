<svg viewBox="0 0 720 348" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono','Courier New',monospace">

  <rect width="720" height="348" fill="#f5f0e8"/>

  <!-- Panel divider -->
  <line x1="360" y1="20" x2="360" y2="306" stroke="rgba(26,24,20,0.12)" stroke-width="1"/>

  <!-- ════════════════════════════════════════════
       LEFT PANEL — Open-lattice truss
  ════════════════════════════════════════════ -->

  <line x1="18" y1="118" x2="342" y2="118" stroke="#b8860b" stroke-width="2"/>
  <line x1="18" y1="156" x2="342" y2="156" stroke="#b8860b" stroke-width="2"/>

  <rect x="68" y="94" width="224" height="80" fill="none" stroke="#1a1814" stroke-width="2.5"/>
  <line x1="124" y1="94"  x2="124" y2="174" stroke="#1a1814" stroke-width="2.5"/>
  <line x1="180" y1="94"  x2="180" y2="174" stroke="#1a1814" stroke-width="2.5"/>
  <line x1="236" y1="94"  x2="236" y2="174" stroke="#1a1814" stroke-width="2.5"/>

  <polygon points="62,114 70,118 62,122"  fill="#b8860b"/>
  <polygon points="296,114 304,118 296,122" fill="#b8860b"/>
  <polygon points="62,152 70,156 62,160"  fill="#b8860b"/>
  <polygon points="296,152 304,156 296,160" fill="#b8860b"/>

  <text x="180" y="210" text-anchor="middle" font-size="10" fill="#b8860b" letter-spacing="0.06em">wind passes through</text>

  <line x1="50" y1="94" x2="50" y2="174" stroke="rgba(26,24,20,0.3)" stroke-width="1"/>
  <line x1="44" y1="94"  x2="56" y2="94"  stroke="rgba(26,24,20,0.3)" stroke-width="1"/>
  <line x1="44" y1="174" x2="56" y2="174" stroke="rgba(26,24,20,0.3)" stroke-width="1"/>
  <text x="38" y="134" text-anchor="middle" font-size="9" fill="#4a4640" transform="rotate(-90,38,134)">7.6 m</text>

  <text x="180" y="232" text-anchor="middle" font-size="11" fill="#1a1814" font-weight="600" letter-spacing="0.04em">Open-lattice truss</text>
  <text x="180" y="250" text-anchor="middle" font-size="10" fill="#4a4640">Wind passes through the structure</text>
  <text x="180" y="266" text-anchor="middle" font-size="10" fill="#b8860b">No pressure difference — no lift</text>

  <!-- ════════════════════════════════════════════
       RIGHT PANEL — Solid plate girder
       Upper and lower deflection curves are mirrors
       of each other. Net lift arrow sits between the
       two stream exits on the right — clear of both
       curves and showing the net result after the
       wind has passed the girder.
  ════════════════════════════════════════════ -->

  <!-- Girder -->
  <rect x="418" y="118" width="224" height="30" fill="#ede8dc" stroke="#1a1814" stroke-width="2.5"/>

  <!-- Pressure zone shading — drawn first, behind curves -->
  <rect x="418" y="84"  width="224" height="34" fill="rgba(139,26,26,0.04)"/>
  <rect x="418" y="148" width="224" height="34" fill="rgba(139,26,26,0.07)"/>

  <!-- Approach arrow -->
  <line x1="374" y1="133" x2="414" y2="133" stroke="#b8860b" stroke-width="2"/>
  <polygon points="414,129 422,133 414,137" fill="#b8860b"/>

  <!-- Upper deflection: arcs above -->
  <path d="M 422,120 C 450,88 590,85 644,104" fill="none" stroke="#b8860b" stroke-width="2"/>
  <polygon points="639,99 648,104 640,110" fill="#b8860b"/>

  <!-- Lower deflection: mirrors upper exactly -->
  <path d="M 422,146 C 450,178 590,181 644,162" fill="none" stroke="#b8860b" stroke-width="2"/>
  <polygon points="639,158 648,162 640,168" fill="#b8860b"/>

  <!-- Pressure labels sitting ON the curves.
       Background mask rect (cream) knocks out the curve line behind each label.
       Upper curve at t≈0.5 passes through ~(523, 93).
       Lower curve at t≈0.5 passes through ~(523, 171). -->
  <rect x="465" y="86" width="116" height="13" fill="#f5f0e8"/>
  <text x="523" y="96" text-anchor="middle" font-size="8" fill="#8b1a1a" letter-spacing="0.12em">LOW PRESSURE</text>

  <rect x="465" y="164" width="116" height="13" fill="#f5f0e8"/>
  <text x="523" y="174" text-anchor="middle" font-size="8" fill="#8b1a1a" letter-spacing="0.12em">HIGH PRESSURE</text>

  <!-- Net lift arrow — placed between the two stream exits,
       to the right of the girder where the curves have cleared -->
  <line x1="656" y1="158" x2="656" y2="114" stroke="#8b1a1a" stroke-width="2.5"/>
  <polygon points="651,114 656,104 661,114" fill="#8b1a1a"/>
  <text x="664" y="112" text-anchor="start" font-size="9" fill="#8b1a1a" letter-spacing="0.06em">net lift</text>

  <text x="520" y="232" text-anchor="middle" font-size="11" fill="#1a1814" font-weight="600" letter-spacing="0.04em">Solid plate girder</text>
  <text x="520" y="250" text-anchor="middle" font-size="10" fill="#4a4640">Wind deflects above and below — 2.4 m deep</text>
  <text x="520" y="266" text-anchor="middle" font-size="10" fill="#8b1a1a">Pressure difference — net upward lift</text>

  <!-- Caption -->
  <line x1="40" y1="292" x2="680" y2="292" stroke="rgba(26,24,20,0.1)" stroke-width="1"/>
  <text x="360" y="309" text-anchor="middle" font-size="10" fill="#4a4640">Wind passes through a truss without obstruction.</text>
  <text x="360" y="327" text-anchor="middle" font-size="10" fill="#4a4640">A solid girder forces wind around it — creating a lift force that acts on the deck.</text>

</svg>
